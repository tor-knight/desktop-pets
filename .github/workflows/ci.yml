name: CI Build & Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build & Archive App
        run: |
          xcodebuild archive \
            -scheme DesktopPets \
            -destination 'platform=macOS' \
            -archivePath build/DesktopPets.xcarchive \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          cd build/DesktopPets.xcarchive/Products/Applications/
          zip -r ../../../../DesktopPets-macOS.zip DesktopPets.app

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -scheme DesktopPets \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPets-macOS
          path: DesktopPets-macOS.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${github.ref#refs/tags/}"
          fi

          gh release create "$TAG_NAME" DesktopPets-macOS.zip \
            --title "Desktop Pets $TAG_NAME" \
            --notes "Release artifact generated automatically by GitHub Actions CI workflow." \
            --clobber || true
