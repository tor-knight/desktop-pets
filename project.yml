name: DesktopPets
options:
  bundleIdPrefix: com.example
  objectVersion: 56
targets:
  DesktopPets:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: [DesktopPets]
    info:
      path: DesktopPets/Info.plist
      properties:
        LSUIElement: true
        NSAppleEventsUsageDescription: "We need input monitoring to track your idle time."
    dependencies: []
  DesktopPetsTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources: [DesktopPetsTests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DesktopPets
